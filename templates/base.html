<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI應用成果展示{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <a class="logo" href="{{ url_for('index') }}">
            Project Hub
        </a>

        <nav>
            <a href="{{ url_for('index') }}">首頁</a>
            <a href="{{ url_for('project_list') }}">專案作品</a>
            <a href="{{ url_for('about') }}">關於本網站</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        Project Hub｜多專案整合展示平台
    </footer>

</body>
</html>
